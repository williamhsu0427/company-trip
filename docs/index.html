<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00695c">
<title>員工旅遊行程比一比</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#1d2321;--sub:#5f6b67;--line:#dfe5e3;--main:#00695c;--main2:#e0f2ef;--warn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#111614;--card:#1a211f;--text:#e8eeec;--sub:#9aa7a3;--line:#2c3532;--main:#4db6a6;--main2:#1e3330;--warn:#f0b04a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
header{background:#00695c;color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
header h1{margin:0;font-size:19px}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
.tabs{display:flex;gap:6px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tab{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:9px 4px;font-size:15px;font-weight:600}
.tab.on{background:var(--main);border-color:var(--main);color:#fff}
main{max-width:860px;margin:0 auto;padding:0 16px 32px}
section{display:none}section.on{display:block}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.filters label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.filters select,.filters input{font-size:15px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);width:100%}
.filters .full{grid-column:1/-1}
.seg{display:flex;gap:6px;grid-column:1/-1}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 4px;font-size:14px}
.seg button.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:600}
.range{display:flex;gap:6px;align-items:center}.range select,.range input{flex:1;min-width:0}.range span{color:var(--sub);font-size:13px}
.agh{display:flex;align-items:baseline;gap:8px;margin:18px 2px 0}.agh h3{margin:0;font-size:17px}.agh .n{color:var(--sub);font-size:13px}.agh a{margin-left:auto;font-size:13px;color:var(--main);text-decoration:none}
.item .tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--main2);color:var(--main);font-weight:600}
@media(min-width:640px){.filters{grid-template-columns:repeat(4,1fr)}.filters .wide{grid-column:span 2}}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin:10px 2px 0;flex-wrap:wrap}
.bar select{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 8px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 10px;font-size:13px}
.chip.off{opacity:.45;text-decoration:line-through}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;display:flex;gap:12px}
.item img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.item .body{min-width:0;flex:1}
.item .ag{font-size:12px;color:var(--main);font-weight:700}
.item b{display:block;font-size:15px;line-height:1.4;margin:2px 0}
.item .meta{font-size:13px;color:var(--sub);line-height:1.5}
.item .price{font-size:17px;font-weight:700;color:var(--warn)}
.item a.go{display:inline-block;margin-top:6px;font-size:13px;color:var(--main);font-weight:600;text-decoration:none}
.empty{text-align:center;color:var(--sub);padding:36px 16px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:4px 0;font-size:14px;color:var(--sub);line-height:1.55}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;text-decoration:none;font-size:14px;border-radius:10px;padding:9px 12px;border:1px solid var(--line);color:var(--text);background:var(--bg)}
.btn.main{background:var(--main);border-color:var(--main);color:#fff;font-weight:600}
.big{width:100%;margin-top:12px;padding:13px;font-size:16px;border:0;border-radius:12px;background:var(--main);color:#fff;font-weight:700}
.note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}
.more{display:block;margin:12px auto 0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 18px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>✈️ 員工旅遊行程比一比</h1>
  <p>彙整台灣各大旅行社的國外行程（不含國內旅遊、不含「找到了」）</p>
</header>
<div class="tabs">
  <button class="tab on" data-s="list">行程清單</button>
  <button class="tab" data-s="byag">一鍵搜尋</button>
  <button class="tab" data-s="corp">企業包團</button>
</div>
<main>
  <div id="filterbox">
    <div class="filters">
      <div class="seg" id="f-type">
        <button data-v="" class="on">全部</button><button data-v="group">團體旅遊</button><button data-v="fit">自由行</button>
      </div>
      <label class="full">關鍵字<input id="f-q" type="search" placeholder="例如：北海道、溫泉、迪士尼"></label>
      <label>國家／地區<select id="f-country"><option value="">全部</option></select></label>
      <label>天數<select id="f-days">
        <option value="">不限</option><option value="1-4">4 天以內</option><option value="5-6">5–6 天</option><option value="7-9">7–9 天</option><option value="10-99">10 天以上</option>
      </select></label>
      <label class="full wide">出發日期<div class="range"><input type="date" id="f-d1"><span>到</span><input type="date" id="f-d2"></div></label>
      <label class="full wide">每人預算<div class="range"><select id="f-p1"><option value="">不限</option></select><span>到</span><select id="f-p2"><option value="">不限</option></select></div></label>
    </div>
    <div class="chips" id="agency-chips"></div>
    <div class="bar"><span id="count">載入中…</span>
      <select id="sort"><option value="price">價格低到高</option><option value="price-d">價格高到低</option><option value="date">出發日近到遠</option><option value="days">天數少到多</option></select>
    </div>
  </div>

  <section id="list" class="on">
    <div id="list-out"></div>
    <button class="more" id="more" hidden>顯示更多</button>
  </section>

  <section id="byag">
    <div id="byag-out"></div>
  </section>

  <section id="corp">
    <p class="note">員工旅遊人數多時，直接請旅行社客製報價通常比較划算。以下是各家的企業旅遊／包團洽詢窗口。</p>
    <div id="c-list"></div>
  </section>
  <p class="note" id="updated"></p>
</main>
<script src="agencies.js"></script>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>n?'$'+n.toLocaleString('zh-TW'):'洽詢';
const PER_AG=5;
let TOURS=[],shown=40,offAg=new Set(),type='',tab='list',openAg=new Set();

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  tab=t.dataset.s;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===tab));
  $('#filterbox').hidden=tab==='corp';
  render();
});
document.querySelectorAll('#f-type button').forEach(b=>b.onclick=()=>{
  type=b.dataset.v;document.querySelectorAll('#f-type button').forEach(x=>x.classList.toggle('on',x===b));shown=40;render();
});

async function load(){
  try{
    const r=await fetch('data/tours.json?'+Date.now());
    const d=await r.json();
    const DOM=/花東|花蓮|台東|臺東|澎湖|金門(?!.*廈)|馬祖|小琉球|綠島|蘭嶼|墾丁|阿里山|日月潭|太魯閣|宜蘭|台南(?!出發)|臺南(?!出發)|嘉義|梅山|基隆|南投|清境|合歡山|環島/;
    TOURS=(d.tours||[]).filter(t=>t.country!=='台灣'&&!DOM.test(t.title)&&!/找到了/.test(t.agency+t.title));
    const today=new Date().toISOString().slice(0,10);
    TOURS.forEach(t=>{t.deps=(t.departures||[]).filter(x=>x>=today).sort();t.type=t.type||'group'});
    $('#updated').textContent=d.updated?`資料更新：${new Date(d.updated).toLocaleString('zh-TW')}。價格與團位以旅行社網站為準。`:'';
  }catch(e){TOURS=[]}
  const countries=[...new Set(TOURS.map(t=>t.country).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  $('#f-country').innerHTML+=countries.map(c=>`<option>${esc(c)}</option>`).join('');
  const today=new Date().toISOString().slice(0,10);
  $('#f-d1').min=$('#f-d2').min=today;
  const ags=[...new Set(TOURS.map(t=>t.agency))];
  $('#agency-chips').innerHTML=ags.map(a=>`<button class="chip" data-a="${esc(a)}">${esc(a)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const a=c.dataset.a;offAg.has(a)?offAg.delete(a):offAg.add(a);c.classList.toggle('off');shown=40;render()});
  render();
}

function filtered(){
  const q=$('#f-q').value.trim().toLowerCase(),c=$('#f-country').value,dd=$('#f-days').value;
  let p1=+$('#f-p1').value||0,p2=+$('#f-p2').value||0;
  if(p1&&p2&&p1>p2)[p1,p2]=[p2,p1];
  let m1=$('#f-d1').value,m2=$('#f-d2').value;
  if(m1&&m2&&m1>m2)[m1,m2]=[m2,m1];
  const inM=d=>(!m1||d>=m1)&&(!m2||d<=m2);
  const [dmin,dmax]=dd?dd.split('-').map(Number):[0,999];
  const L=TOURS.filter(t=>!offAg.has(t.agency)
    &&(!type||t.type===type)
    &&(!q||(t.title+t.country).toLowerCase().includes(q))
    &&(!c||t.country===c)
    &&(!(m1||m2)||t.deps.some(inM))
    &&(!dd||(t.days>=dmin&&t.days<=dmax))
    &&(!(p1||p2)||(t.price&&t.price>=p1&&(!p2||t.price<=p2))));
  const s=$('#sort').value,first=t=>t.deps.find(inM)||'9999';
  L.sort(s==='price'?(a,b)=>(a.price||1e9)-(b.price||1e9):s==='price-d'?(a,b)=>(b.price||0)-(a.price||0):s==='date'?(a,b)=>first(a).localeCompare(first(b)):(a,b)=>(a.days||99)-(b.days||99));
  return {L,inM,q};
}

function card(t,inM){
  const ds=t.deps.filter(inM),deps=ds.slice(0,4).map(d=>d.slice(5).replace('-','/')).join('、');
  return `<div class="item">${t.image?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(t.image)}" alt="" onerror="this.remove()">`:''}<div class="body">
    <div class="ag">${esc(t.agency)}${t.country?' · '+esc(t.country):''}<span class="tag">${t.type==='fit'?'自由行':'團體'}</span></div>
    <b>${esc(t.title)}</b>
    <div class="meta">${t.days?t.days+' 天':''}${deps?' · 出發 '+deps+(ds.length>4?' 等':''):''}</div>
    <div class="price">${fmt(t.price)}<span class="meta"> 起／人</span></div>
    <a class="go" href="${esc(t.url)}" target="_blank" rel="noopener">看行程細節 →</a></div></div>`;
}

function render(){
  if(tab==='corp')return;
  const {L,inM,q}=filtered();
  $('#count').textContent=TOURS.length?`找到 ${L.length} 個行程`:'';
  if(!TOURS.length){$('#list-out').innerHTML=$('#byag-out').innerHTML='<div class="empty">還沒有行程資料，請稍後再來看看。</div>';$('#more').hidden=true;return}
  if(tab==='list'){
    $('#list-out').innerHTML=L.length?L.slice(0,shown).map(t=>card(t,inM)).join(''):'<div class="empty">沒有符合條件的行程，試著放寬條件看看。</div>';
    $('#more').hidden=L.length<=shown;
  }else{
    const by={};L.forEach(t=>(by[t.agency]=by[t.agency]||[]).push(t));
    const names=AGENCIES.map(a=>a.name).filter(n=>!offAg.has(n));
    $('#byag-out').innerHTML=names.map(n=>{
      const a=AGENCIES.find(x=>x.name===n),list=by[n]||[],all=openAg.has(n);
      return `<div class="agh"><h3>${esc(n)}</h3><span class="n">${list.length} 個</span><a target="_blank" rel="noopener" href="${esc(a.search(q))}">到官網搜尋 ↗</a></div>`+
        (list.length?list.slice(0,all?list.length:PER_AG).map(t=>card(t,inM)).join('')+
          (list.length>PER_AG&&!all?`<button class="more" data-ag="${esc(n)}">顯示 ${esc(n)} 全部 ${list.length} 個</button>`:'')
        :`<div class="empty" style="padding:14px">${by[n]===undefined&&!TOURS.some(t=>t.agency===n)?'這家目前沒抓到資料，可以點「到官網搜尋」':'沒有符合條件的行程'}</div>`);
    }).join('');
    document.querySelectorAll('#byag-out .more').forEach(b=>b.onclick=()=>{openAg.add(b.dataset.ag);render()});
    $('#more').hidden=true;
  }
}
['#f-q','#f-country','#f-d1','#f-d2','#f-days','#f-p1','#f-p2','#sort'].forEach(s=>$(s).addEventListener('input',()=>{shown=40;openAg.clear();render()}));
$('#more').onclick=()=>{shown+=40;render()};

$('#c-list').innerHTML=AGENCIES.filter(a=>a.corp).map(a=>`<div class="card"><h3>${esc(a.name)}</h3>
  ${a.corp.note?`<p>${esc(a.corp.note)}</p>`:''}
  <div class="row">${a.corp.url?`<a class="btn main" target="_blank" rel="noopener" href="${esc(a.corp.url)}">企業旅遊頁面</a>`:''}
  ${a.corp.tel?`<a class="btn" href="tel:${esc(a.corp.tel.replace(/[^\d+#,]/g,''))}">📞 ${esc(a.corp.tel)}</a>`:''}
  ${a.corp.email?`<a class="btn" href="mailto:${esc(a.corp.email)}">✉️ ${esc(a.corp.email)}</a>`:''}</div></div>`).join('');

{const o=[];for(let v=5000;v<=200000;v+=5000)o.push(`<option value="${v}">${v.toLocaleString('zh-TW')} 元</option>`);
 $('#f-p1').innerHTML+=o.join('');$('#f-p2').innerHTML+=o.join('');}
load();
</script>
</body>
</html>
