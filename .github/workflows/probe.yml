name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/probe.py
      - name: push results to probe branch
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout --orphan probe-out
          git rm -rfq --cached .
          git add -f probe
          git commit -qm "probe results"
          git push -f origin probe-out
